<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>QoL for LibreChat</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #1c1c22;
        --muted: #5d5d6b;
        --line: #d9d9e2;
        --accent: #5b4a94;
        --accent-text: #ffffff;
        --ok: #2f6b4a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #26262e;
          --text: #e8e8ee;
          --muted: #a3a3b4;
          --line: #3a3a46;
          --accent: #7a68bd;
          --accent-text: #ffffff;
          --ok: #7fc8a0;
        }
      }
      body {
        margin: 0;
        padding: 14px 16px 16px;
        width: 300px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 system-ui, sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 14px;
        font-weight: 600;
      }
      .site {
        margin: 0 0 6px;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .state {
        margin: 0 0 10px;
      }
      .state.on {
        color: var(--ok);
        font-weight: 600;
      }
      button {
        width: 100%;
        padding: 8px 0;
        border: 1px solid var(--accent);
        border-radius: 8px;
        background: var(--accent);
        color: var(--accent-text);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.off {
        background: transparent;
        color: var(--text);
        border-color: var(--line);
        font-weight: 400;
      }
      button[hidden] {
        display: none;
      }
      .note {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>QoL for LibreChat</h1>
    <p class="site" id="site"></p>
    <p class="state" id="state"></p>
    <button id="toggle" hidden></button>
    <p class="note" id="note"></p>
    <script src="popup.js"></script>
  </body>
</html>
